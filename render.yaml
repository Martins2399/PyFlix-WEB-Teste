services:
  - type: web
    name: pyflix
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT server:app
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: pyflix-db
          property: connectionString

databases:
  - name: pyflix-db
    databaseName: pyflix
    user: pyflix
    plan: free
